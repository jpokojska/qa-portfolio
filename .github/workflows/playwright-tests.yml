name: QA Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout qa-portfolio
        uses: actions/checkout@v4

      - name: Set up Java 26
        uses: actions/setup-java@v4
        with:
          java-version: '26'
          distribution: 'temurin'

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Checkout Restful-Booker Platform
        uses: actions/checkout@v4
        with:
          repository: mwinteringham/restful-booker-platform
          # Pinned so upstream changes don't break CI unexpectedly.
          # To upgrade: pick a newer commit from the trunk branch, update the SHA and check CI passes.
          ref: d36bd3f8647a091d406e53bad463c5e3e5d2ece1
          path: restful-booker-platform

      - name: Build Restful-Booker Platform
        working-directory: restful-booker-platform
        run: mvn clean install -DskipTests

      - name: Start Restful-Booker Platform
        working-directory: restful-booker-platform
        run: nohup bash run_locally.sh > rbp.log 2>&1 &

      - name: Wait for app to be ready
        run: |
          echo "Waiting for Restful-Booker to start..."
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3003 > /dev/null \
              && curl -s -o /dev/null http://localhost:3000/booking/ \
              && curl -s -o /dev/null http://localhost:3004/auth/; then
              echo "App is up!"
              exit 0
            fi
            echo "Attempt $i — waiting 5s..."
            sleep 5
          done
          echo "App did not start in time"
          cat restful-booker-platform/rbp.log || true
          exit 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        working-directory: e2e-tests
        run: pip install -r requirements.txt

      - name: Install Playwright with dependencies
        run: python -m playwright install --with-deps chromium

      - name: Run Postman API tests (Newman)
        id: newman
        run: |
          npx --yes newman@6 run api-tests/postman/Restful-Booker-Platform.postman_collection.json \
            -e api-tests/postman/environments/local.postman_environment.json \
            --env-var base_url=http://localhost:3000 \
            --env-var auth_url=http://localhost:3004 \
            --reporters cli,junit \
            --reporter-junit-export api-tests/newman-report.xml

      # Run UI tests even if API tests failed, so both results are visible in one run
      - name: Run Playwright tests
        if: ${{ !cancelled() && steps.newman.outcome != 'skipped' }}
        working-directory: e2e-tests
        run: |
          pytest tests/ \
            --html=report.html \
            --self-contained-html \
            -v

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            api-tests/newman-report.xml
            e2e-tests/report.html
            e2e-tests/test-results/
            restful-booker-platform/rbp.log
          retention-days: 14